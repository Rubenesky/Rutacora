name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Comprobación de tipos (vue-tsc)
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Comprobar noindex y ausencia de robots.txt con Disallow
        run: |
          grep -q 'name="robots" content="noindex, nofollow"' dist/index.html || {
            echo "::error::dist/index.html no contiene la meta noindex,nofollow"
            exit 1
          }
          if [ -f dist/robots.txt ] && grep -q 'Disallow: /' dist/robots.txt; then
            echo "::error::dist/robots.txt no debe contener Disallow: / (bloquearía el rastreo y con él, que los buscadores vean noindex)"
            exit 1
          fi
